<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>

    <a-scene>
      <a-box position="-1 1.5 -3" rotation="0 90 0" color="#61F527"></a-box>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#00A160"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#DBA200"></a-sphere>

      <a-sphere position="-4.5 1.25 -5" radius="1.25" color="#C71C7B"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#949200"></a-cylinder>
      <a-cylinder position="1 0.50 -2" radius="0.5" height="1" color="#"></a-cylinder>
      <a-cylinder position="1 0.25 -1" radius="0.5" height="0.5" color="#Red"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#Yellow"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
